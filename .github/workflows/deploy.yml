name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/pliffdax/aion-api
  TELEGRAM_BOT_IMAGE: ghcr.io/pliffdax/aion-telegram-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            APP=api
            AION_GIT_SHA=${{ github.sha }}
            AION_GIT_REF=${{ github.ref_name }}
            AION_GIT_REPOSITORY=${{ github.repository }}
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Telegram bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            APP=telegram-bot
            AION_GIT_SHA=${{ github.sha }}
            AION_GIT_REF=${{ github.ref_name }}
            AION_GIT_REPOSITORY=${{ github.repository }}
          tags: |
            ${{ env.TELEGRAM_BOT_IMAGE }}:${{ github.sha }}
            ${{ env.TELEGRAM_BOT_IMAGE }}:latest
          cache-from: type=gha,scope=telegram-bot
          cache-to: type=gha,mode=max,scope=telegram-bot

      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main)
              echo "deploy_path=/srv/aion/app" >> "$GITHUB_OUTPUT"
              echo "shared_dir=/srv/aion/shared" >> "$GITHUB_OUTPUT"
              echo "compose_project=aion" >> "$GITHUB_OUTPUT"
              echo "api_host_port=3010" >> "$GITHUB_OUTPUT"
              echo "postgres_host_port=5442" >> "$GITHUB_OUTPUT"
              echo "pg_volume=aion_pg" >> "$GITHUB_OUTPUT"
              ;;
            development)
              echo "deploy_path=/srv/aion-dev/app" >> "$GITHUB_OUTPUT"
              echo "shared_dir=/srv/aion-dev/shared" >> "$GITHUB_OUTPUT"
              echo "compose_project=aion-dev" >> "$GITHUB_OUTPUT"
              echo "api_host_port=3011" >> "$GITHUB_OUTPUT"
              echo "postgres_host_port=5443" >> "$GITHUB_OUTPUT"
              echo "pg_volume=aion_dev_pg" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deploy branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.AION_DEPLOY_SSH_KEY }}" > ~/.ssh/aion_deploy
          chmod 600 ~/.ssh/aion_deploy
          ssh-keyscan -H "${{ secrets.AION_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deploy files
        run: |
          ssh -i ~/.ssh/aion_deploy \
            "${{ secrets.AION_DEPLOY_USER }}@${{ secrets.AION_DEPLOY_HOST }}" \
            "mkdir -p '${{ steps.target.outputs.deploy_path }}'"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/aion_deploy" \
            deploy/ "${{ secrets.AION_DEPLOY_USER }}@${{ secrets.AION_DEPLOY_HOST }}:${{ steps.target.outputs.deploy_path }}/deploy/"

      - name: Run deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/aion_deploy \
            "${{ secrets.AION_DEPLOY_USER }}@${{ secrets.AION_DEPLOY_HOST }}" \
            "cd '${{ steps.target.outputs.deploy_path }}' && AION_IMAGE_TAG='${{ github.sha }}' AION_SHARED_DIR='${{ steps.target.outputs.shared_dir }}' AION_COMPOSE_PROJECT='${{ steps.target.outputs.compose_project }}' AION_API_HOST_PORT='${{ steps.target.outputs.api_host_port }}' AION_POSTGRES_HOST_PORT='${{ steps.target.outputs.postgres_host_port }}' AION_PG_VOLUME='${{ steps.target.outputs.pg_volume }}' GHCR_USERNAME='${{ github.actor }}' GHCR_TOKEN='$GHCR_TOKEN' bash deploy/scripts/deploy.sh"
