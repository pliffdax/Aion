name: aion-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aion
      POSTGRES_PASSWORD: aion
      POSTGRES_DB: aion
    ports:
      - '127.0.0.1:${AION_POSTGRES_HOST_PORT:-5444}:5432'
    volumes:
      - aion_pg:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aion -d aion']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aion_pg:
